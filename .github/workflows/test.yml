name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # The end-to-end tests record with the real binary; without it they skip
      # themselves and the run would prove less than it looks like it does.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements_test.txt
      - name: Core suite (no Home Assistant)
        run: pytest tests -q
      - name: Home Assistant suite
        run: pytest -c tests_ha/pytest.ini tests_ha -q
      - name: Lint
        run: ruff check custom_components tests tests_ha

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # The bundle is committed, so a build that changes it means someone
      # edited the sources without rebuilding.
      - name: The committed bundle matches the sources
        run: git diff --exit-code custom_components/camwatch/frontend/dist
